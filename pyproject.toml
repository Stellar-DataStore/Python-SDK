[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stellards"
dynamic = ["version"]
description = "Python SDK for the StellarDS.io v2 API (sync and async)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "TMS Software", email = "info@stellards.io" }]
keywords = ["stellards", "database", "api", "sdk", "rest", "backend"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "ruff>=0.5",
    "mypy>=1.8",
    "build>=1",
]

[project.urls]
Homepage = "https://stellards.io"
Documentation = "https://github.com/stellar-datastore/Python-SDK#readme"
Repository = "https://github.com/stellar-datastore/Python-SDK"
Issues = "https://github.com/stellar-datastore/Python-SDK/issues"
Changelog = "https://github.com/stellar-datastore/Python-SDK/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/stellards/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stellards"]

[tool.hatch.build.targets.sdist]
include = ["src/stellards", "tests", "examples", "scripts", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "A"]
ignore = [
    "UP007", # X | Y in runtime-evaluated aliases needs Python 3.10
    "A002",  # a field's `type` parameter is named like the builtin on purpose
    "RUF009", # dataclass defaults come from the models' field helper
    "RUF022", # __all__ is grouped by topic, not sorted
]

[tool.ruff.format]
exclude = ["src/stellards/_async/resources.py"]  # generated from _sync/resources.py

[tool.ruff.lint.per-file-ignores]
"src/stellards/_async/resources.py" = ["E501", "RUF100"]
"tests/*" = ["N802"]
"examples/*" = ["N802"]

[tool.mypy]
strict = true
files = ["src/stellards", "tests", "examples", "scripts"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["smbus2", "smbus2.*"]
ignore_missing_imports = true
